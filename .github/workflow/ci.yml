name: CI Pipeline

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r requirements.txt

      - name: Lint with flake8 (critical errors)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint with flake8 (code style)
        run: flake8 . --count --statistics

      - name: Build Docker image
        run: docker build -t trip-service:test .

      - name: Smoke test container
        run: |
          docker run -d --name ts -p 8000:8000 trip-service:test
          sleep 5
          curl --fail http://localhost:8000/docs
          curl --fail http://localhost:8000/api/v1/trip-requests/
